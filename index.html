<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="group 7 Hajime TS Capstone Project.">
    <meta name="description" content="Planet: search the planets of our solar system and compare their key facts.">
    <title>Planet | Solar System Facts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <script src="script.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header" id="site-header">
        <div class="container site-header__inner">
            <a class="logo" href="./">
                <img src="image/planetlogo.jpeg" alt="planet" />
            </a>
            <div id="theme-toggle-slot"></div>
        </div>
    </header>

    <main id="main" class="container">


        <!-- [feature/header-search] Search form goes here -->
        <section id="search-section" aria-label="Search planets">
            <form class="search-form" role="search">
                <svg class="search-form__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
                <input class="search-form__input" type="search" id="planet-search" placeholder="Search planet name" aria-label="Search planet name" />
                <button class="search-form__btn" type="submit">Search</button>
            </form>
        </section>
        <section id="planet-details" aria-label="Planet details" aria-live="polite">
            <p id="planet-status" class="status">Loading planets…</p>
        </section>
        <!-- [feature/planet-card] Planet card renders here -->

        <section id="facts-section" aria-labelledby="facts-title">
            <h2 id="facts-title">Planetary Facts at a Glance</h2>
            <p>Below is a comparative table of major planets in our solar system. The data highlights key physical properties used by astronomers and researchers worldwide.</p>
            <div id="facts-table-container" class="table-wrapper">

                <!-- [feature/facts-table] Table renders here -->

            </div>
        </section>
    </main>

    <footer class="site-footer" id="site-footer">
        <div class="container">

            <!-- [feature/footer] About text and links go here -->



        </div>
    </footer>
</body>

</html>
